# MySQL + Postgres for the wire dump-loader e2e.
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-dumpload-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13486:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-dumpload-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15582:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
