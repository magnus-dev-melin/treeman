# MySQL + Postgres for the db_query read-only enforcement e2e.
services:
  mysql:
    image: mysql:8.4
    container_name: treeman-e2e-dbquery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "13476:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    container_name: treeman-e2e-dbquery-postgres
    environment:
      POSTGRES_PASSWORD: pgpw
    ports:
      - "15572:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
